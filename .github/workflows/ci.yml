name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore EventStoreCore.slnx

      - name: Build
        run: dotnet build EventStoreCore.slnx --configuration Release --no-restore /p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test EventStoreCore.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Pack
        run: dotnet pack EventStoreCore.slnx --configuration Release --no-build /p:PackageVersion=1.0.0-ci.${{ github.run_number }} /p:ContinuousIntegrationBuild=true /p:GeneratePackageOnBuild=false -o artifacts/packages

      - name: Validate package contents
        shell: pwsh
        run: ./eng/Validate-Packages.ps1 artifacts/packages

      - name: Build packed-package consumer
        run: >
          dotnet build tests/EventStoreCore.PackageSmoke/EventStoreCore.PackageSmoke.csproj
          --configuration Release
          /p:PackageVersion=1.0.0-ci.${{ github.run_number }}
          /p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
